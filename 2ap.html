<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة الطبيب - التقارير</title>
    <style>
        :root {
            --primary: #0f766e;
            --success: #10b981;
            --bg: #f8fafc;
            --card: #ffffff;
        }
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); padding: 20px; }
        .layout { display: grid; grid-template-columns: 280px 1fr; gap: 20px; max-width: 1000px; margin: auto; }
        .sidebar { background: var(--card); border: 1px solid #e2e8f0; border-radius: 10px; padding: 15px; height: calc(100vh - 40px); }
        .main { background: var(--card); border: 1px solid #e2e8f0; border-radius: 10px; padding: 24px; }
        h3 { font-size: 16px; color: var(--primary); margin-bottom: 12px; }
        .item { padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px; margin-bottom: 8px; cursor: pointer; background: #fff; }
        .item.active { border-color: var(--primary); background: #f0fdfa; }
        .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; margin-left: 6px; }
        .dot.done { background: var(--success); }
        .box-info { background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .btn-dl { background: #2563eb; color: white; padding: 8px 14px; border-radius: 6px; text-decoration: none; font-size: 13px; font-weight: 600; }
        .field { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
        textarea { width: 100%; height: 100px; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; background: #f8fafc; }
        .word-zone { border: 2px dashed #cbd5e1; padding: 15px; border-radius: 8px; text-align: center; background: #f8fafc; cursor: pointer; }
        .word-zone:hover { border-color: var(--primary); }
        .btn-save { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .ok-msg { display: none; margin-top: 12px; padding: 10px; background: #dcfce7; color: #166534; border-radius: 6px; text-align: center; font-size: 13px; font-weight: 600; }
    </style>
</head>
<body>

<div class="layout">
    <!-- قائمة الحالات -->
    <div class="sidebar">
        <h3>الحالات الواردة</h3>
        <div id="list">
            <div class="item active" onclick="loadCase('محمود علي الأشهر', '45', 'CT Scan', 'dot1')">
                <div style="font-weight:700;"><span class="dot" id="dot1"></span> محمود علي الأشهر</div>
                <div style="font-size:11px; color:#64748b; margin-top:4px;">CT Scan - 45 سنة</div>
            </div>
            <div class="item" onclick="loadCase('سالم محمد التائب', '32', 'MRI', 'dot2')">
                <div style="font-weight:700;"><span class="dot done" id="dot2"></span> سالم محمد التائب</div>
                <div style="font-size:11px; color:#64748b; margin-top:4px;">MRI - 32 سنة</div>
            </div>
        </div>
    </div>

    <!-- التفاصيل وإرفاق التقرير -->
    <div class="main">
        <div class="box-info">
            <div>
                <h2 id="cName" style="font-size:18px;">محمود علي الأشهر</h2>
                <p id="cMeta" style="font-size:12px; color:#64748b; margin-top:2px;">العمر: 45 سنة | نوع الفحص: CT Scan</p>
            </div>
            <a href="#" class="btn-dl" id="dlBtn">📥 تحميل ZIP</a>
        </div>

        <form id="docForm">
            <div class="field">
                <label>التقرير الطبي / ملاحظات التشخيص</label>
                <textarea placeholder="اكتب التقرير هنا..."></textarea>
            </div>

            <div class="field">
                <label>إرفاق تقرير بصيغة Word (.docx)</label>
                <div class="word-zone" onclick="document.getElementById('wFile').click()">
                    <div style="font-size:20px;">📝</div>
                    <div id="wTxt" style="font-size:12px; color:#64748b;">اضغط لإرفاق ملف الوورد (.docx)</div>
                    <input type="file" id="wFile" style="display:none" accept=".doc,.docx">
                </div>
            </div>

            <button type="submit" class="btn-save">حفظ وإرسال التقرير</button>
            <div class="ok-msg" id="okMsg">✓ تم حفظ وإرفاق التقرير بنجاح لهذا المريض!</div>
        </form>
    </div>
</div>

<script>
    let activeDotId = 'dot1';

    function loadCase(name, age, exam, dotId) {
        activeDotId = dotId;
        document.getElementById('cName').textContent = name;
        document.getElementById('cMeta').textContent = `العمر: ${age} سنة | نوع الفحص: ${exam}`;
        document.getElementById('okMsg').style.display = 'none';
        document.getElementById('wTxt').textContent = "اضغط لإرفاق ملف الوورد (.docx)";
        document.getElementById('docForm').reset();
    }

    document.getElementById('wFile').onchange = (e) => {
        if(e.target.files.length) {
            document.getElementById('wTxt').innerHTML = `<b>تم إرفاق:</b> ${e.target.files[0].name}`;
        }
    };

    document.getElementById('docForm').onsubmit = (e) => {
        e.preventDefault();
        document.getElementById('okMsg').style.display = 'block';
        if(activeDotId) {
            document.getElementById(activeDotId).classList.add('done');
        }
    };
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://ctinfdachjsqwqbuumgj.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_lOy6jzHus_ICjJX4tDvxrQ_u7xpSojJ';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function fetchCases() {
    const { data: cases, error } = await supabaseClient
      .from('cases')
      .select('*')
      .order('created_at', { ascending: false });

    if (!error) {
      renderCasesList(cases);
    }
  }

  // استدعاء الحالات فور فتح الصفحة
  fetchCases();
</script>
</body>
</html>
